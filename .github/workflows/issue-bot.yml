name: Issue Command Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    name: Run Issue Bot
    runs-on: ubuntu-latest
    if: >
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/think') ||
       startsWith(github.event.comment.body, '/solve') ||
       startsWith(github.event.comment.body, '/review'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run issue bot (think/review, and ack solve)
        id: solve
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          node .github/scripts/issue-bot.cjs

      - name: Install Continue CLI and caveman skills (solve)
        if: startsWith(github.event.comment.body, '/solve')
        run: |
          set -e
          # Ensure repo config exists; do not rely on ~/.continue
          if [ ! -f .continue/config.yaml ]; then
            echo ".continue/config.yaml not found in repo. Please add it." >&2
            exit 1
          fi

          # Optional: if a local runner script exists, make it executable
          if [ -f .github/continue-ci.sh ]; then
            chmod +x .github/continue-ci.sh || true
          fi

          # Install official Continue CLI package
          npm i -g @continuedev/cli@latest

          # Best-effort caveman skill install
          if command -v cn >/dev/null 2>&1; then
            cn skills install caveman --config .continue/config.yaml || true
          elif command -v continue-cli >/dev/null 2>&1; then
            continue-cli skills install caveman --config .continue/config.yaml || true
          else
            echo "Continue CLI not in PATH after install; continuing anyway."
          fi

      - name: Run Continue (or project runner) to solve and modify code
        id: cont
        if: startsWith(github.event.comment.body, '/solve')
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          set -e
          mkdir -p .github/issue-bot
          # Extract prompt text after '/solve' (trim leading '/solve' and optional ':' and spaces)
          PROMPT="$(printf "%s" "${COMMENT_BODY}" | sed -E 's#^/solve[[:space:]]*:?[[:space:]]*##')"

          # Fetch recent issue comments (exclude this command), latest first, cap 10
          COMMENTS_URL="https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100"
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${COMMENTS_URL}" \
            | jq -r --argjson excludeId "${COMMENT_ID}" '
                sort_by(.created_at) 
                | map(select(.id != $excludeId)) 
                | (if length > 10 then .[-10:] else . end) 
                | reverse 
                | .[] 
                | "Author: \(.user.login) (\(.author_association))\nComment:\n\(.body)\n---\n"' \
            > .github/issue-bot/comments.txt || true

          # Compose a rich prompt for Continue
          {
            echo "Repository wants a fix PR for Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo
            echo "Issue body:"
            printf "%s\n" "${ISSUE_BODY}"
            echo
            echo "User prompt:"
            printf "%s\n" "${PROMPT}"
            echo
            echo "Recent issue comments (latest first, max 10, excluding this command):"
            if [ -s .github/issue-bot/comments.txt ]; then cat .github/issue-bot/comments.txt; else echo "(none)"; fi
            echo
            echo "Instructions:"
            echo "- Make minimal, correct code changes directly in the working tree."
            echo "- Include tests or config updates if needed."
            echo "- Do not stage or commit; just modify files."
          } > .github/issue-bot/prompt.txt

          # Prefer a project-provided runner
          RAN=false
          if [ -x .github/continue-ci.sh ]; then
            echo "Running project runner: .github/continue-ci.sh"
            PROMPT_FILE=.github/issue-bot/prompt.txt bash .github/continue-ci.sh | tee .github/issue-bot/continue.log || true
            RAN=true
          elif [ -f package.json ] && command -v jq >/dev/null 2>&1 && jq -e '.scripts["continue:ci"]' package.json >/dev/null; then
            echo "Running npm script: continue:ci"
            npm run -s continue:ci -- .github/issue-bot/prompt.txt | tee .github/issue-bot/continue.log || true
            RAN=true
          elif command -v cn >/dev/null 2>&1; then
            echo "Running cn"
            cn run --repo . --config .continue/config.yaml --prompt-file .github/issue-bot/prompt.txt | tee .github/issue-bot/continue.log || true
            RAN=true
          elif command -v continue-cli >/dev/null 2>&1; then
            echo "Running continue-cli"
            continue-cli run --repo . --config .continue/config.yaml --prompt-file .github/issue-bot/prompt.txt | tee .github/issue-bot/continue.log || true
            RAN=true
          else
            echo "No Continue runner found (no .github/continue-ci.sh, no npm script 'continue:ci', no cn nor continue-cli)." >&2
            echo "Please provide a runner (e.g., .github/continue-ci.sh) that reads PROMPT_FILE and uses .continue/config.yaml." >&2
          fi

          # Detect changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "pr_title=fix: Resolve #${ISSUE_NUMBER} - ${ISSUE_TITLE} (bot via Continue)" >> "$GITHUB_OUTPUT"
            # Build PR body
            {
              echo "This PR was generated by a Continue-based CI run using repo .continue/config.yaml."
              echo
              echo "- Issue: #${ISSUE_NUMBER}"
              echo "- Command: /solve"
              echo
              echo "Execution log (truncated):"
              echo '```'
              tail -n 400 .github/issue-bot/continue.log || true
              echo '```'
            } > .github/issue-bot/pr-body.md
            echo "pr_body_file=.github/issue-bot/pr-body.md" >> "$GITHUB_OUTPUT"
          else
            echo "No changes produced by Continue runner."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch (if provided)
        if: steps.solve.outputs.has_patch == 'true'
        run: |
          set -e
          echo "Applying patch..."
          if git apply --index -p1 .github/issue-bot/patch.diff; then
            echo "Applied with -p1"
          elif git apply --index -p0 .github/issue-bot/patch.diff; then
            echo "Applied with -p0"
          else
            echo "Failed to apply patch" >&2
            exit 1
          fi
          echo "Patch applied. Changed files:"
          git status --porcelain

      - name: Create PR from AI patch
        id: cpr
        if: steps.solve.outputs.has_patch == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: issue-bot/issue-${{ github.event.issue.number }}-solve
          commit-message: ${{ steps.solve.outputs.pr_title }}
          title: ${{ steps.solve.outputs.pr_title }}
          body-path: ${{ steps.solve.outputs.pr_body_file }}
          labels: bot, automated, issue-bot

      - name: Comment with PR link (AI patch)
        if: steps.solve.outputs.has_patch == 'true' && steps.cpr.outputs.pull-request-url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          BODY=$(jq -nc --arg body "Opened PR: ${PR_URL}" '{body: $body}')
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            -X POST \
            -d "${BODY}" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments"


      - name: Create PR from Continue changes
        id: cpr_continue
        if: steps.cont.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: issue-bot/issue-${{ github.event.issue.number }}-continue
          commit-message: ${{ steps.solve.outputs.pr_title }}
          title: ${{ steps.solve.outputs.pr_title }}
          body-path: .github/issue-bot/pr-body.md
          labels: bot, automated, issue-bot, continue

      - name: Comment with PR link (Continue)
        if: steps.cont.outputs.has_changes == 'true' && steps.cpr_continue.outputs.pull-request-url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.cpr_continue.outputs.pull-request-url }}
        run: |
          BODY=$(jq -nc --arg body "Opened PR: ${PR_URL}" '{body: $body}')
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            -X POST \
            -d "${BODY}" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments"



