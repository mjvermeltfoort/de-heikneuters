name: Issue Command Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    name: Run Issue Bot
    runs-on: ubuntu-latest
    if: >
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/think') ||
       startsWith(github.event.comment.body, '/solve') ||
       startsWith(github.event.comment.body, '/review'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run issue bot (think/review, and ack solve)
        id: solve
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          node .github/scripts/issue-bot.js

      - name: Setup Continue CLI and caveman skills (solve)
        if: startsWith(github.event.comment.body, '/solve')
        run: |
          set -e
          # Ensure repo config exists; do not rely on ~/.continue
          if [ ! -f .continue/config.yaml ]; then
            echo ".continue/config.yaml not found in repo. Please add it." >&2
            exit 1
          fi

          # Install Continue CLI
          npm i -g @continuedev/continue-cli@latest

          # Attempt to install caveman skills using repo config (non-fatal if syntax differs)
          if command -v continue-cli >/dev/null 2>&1; then
            continue-cli skills install caveman --config .continue/config.yaml || true
          elif command -v continue >/dev/null 2>&1; then
            continue skills install caveman --config .continue/config.yaml || true
          fi

      - name: Run Continue CLI to solve and modify code
        id: cont
        if: startsWith(github.event.comment.body, '/solve')
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          set -e
          mkdir -p .github/issue-bot
          # Extract prompt text after '/solve' (trim leading '/solve' and optional ':' and spaces)
          PROMPT="$(printf "%s" "${COMMENT_BODY}" | sed -E 's#^/solve[[:space:]]*:?[[:space:]]*##')"

          # Compose a rich prompt for Continue
          {
            echo "Repository wants a fix PR for Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo
            echo "Issue body:"
            printf "%s\n" "${ISSUE_BODY}"
            echo
            echo "User prompt:"
            printf "%s\n" "${PROMPT}"
            echo
            echo "Instructions:"
            echo "- Make minimal, correct code changes directly in the working tree."
            echo "- Include tests or config updates if needed."
            echo "- Do not stage or commit; just modify files."
          } > .github/issue-bot/prompt.txt

          # Run Continue CLI headless; capture output for PR body
          if command -v continue-cli >/dev/null 2>&1; then
            continue-cli run --repo . --config .continue/config.yaml --prompt-file .github/issue-bot/prompt.txt | tee .github/issue-bot/continue.log || true
          else
            continue run --repo . --config .continue/config.yaml --prompt-file .github/issue-bot/prompt.txt | tee .github/issue-bot/continue.log || true
          fi

          # Detect changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "pr_title=fix: Resolve #${ISSUE_NUMBER} - ${ISSUE_TITLE} (bot via Continue)" >> "$GITHUB_OUTPUT"
            # Build PR body
            {
              echo "This PR was generated by Continue CLI using repo .continue/config.yaml."
              echo
              echo "- Issue: #${ISSUE_NUMBER}"
              echo "- Command: /solve"
              echo
              echo "Execution log (truncated):"
              echo '```'
              tail -n 400 .github/issue-bot/continue.log
              echo '```'
            } > .github/issue-bot/pr-body.md
            echo "pr_body_file=.github/issue-bot/pr-body.md" >> "$GITHUB_OUTPUT"
          else
            echo "No changes produced by Continue."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch (if provided)
        if: steps.solve.outputs.has_patch == 'true'
        run: |
          set -e
          echo "Applying patch..."
          if git apply --index -p1 .github/issue-bot/patch.diff; then
            echo "Applied with -p1"
          elif git apply --index -p0 .github/issue-bot/patch.diff; then
            echo "Applied with -p0"
          else
            echo "Failed to apply patch" >&2
            exit 1
          fi
          echo "Patch applied. Changed files:"
          git status --porcelain

      - name: Create PR from AI patch
        id: cpr
        if: steps.solve.outputs.has_patch == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: issue-bot/issue-${{ github.event.issue.number }}-solve
          commit-message: ${{ steps.solve.outputs.pr_title }}
          title: ${{ steps.solve.outputs.pr_title }}
          body-path: ${{ steps.solve.outputs.pr_body_file }}
          labels: bot, automated, issue-bot

      - name: Comment with PR link (AI patch)
        if: steps.solve.outputs.has_patch == 'true' && steps.cpr.outputs.pull-request-url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            -X POST \
            -d "$(jq -nc --arg body \"Opened PR (AI patch): ${PR_URL}\" '{body: $body}')" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments"

      - name: Create PR from Continue changes
        id: cpr_continue
        if: steps.cont.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: issue-bot/issue-${{ github.event.issue.number }}-continue
          commit-message: ${{ steps.solve.outputs.pr_title }}
          title: ${{ steps.solve.outputs.pr_title }}
          body-path: .github/issue-bot/pr-body.md
          labels: bot, automated, issue-bot, continue

      - name: Comment with PR link (Continue)
        if: steps.cont.outputs.has_changes == 'true' && steps.cpr_continue.outputs.pull-request-url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.cpr_continue.outputs.pull-request-url }}
        run: |
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            -X POST \
            -d "$(jq -nc --arg body \"Opened PR (Continue): ${PR_URL}\" '{body: $body}')" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments"