name: Generate favicon assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-favicon.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Generate favicon assets from logo
        run: |
          python3 <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("public/assets/logo-heikneuters-2026.png")
          image = Image.open(source).convert("RGBA")
          bbox = image.getbbox()
          if bbox:
              image = image.crop(bbox)

          def square(size, padding=0.04, background=(0, 0, 0, 0)):
              canvas = Image.new("RGBA", (size, size), background)
              pad = round(size * padding)
              max_w = size - (2 * pad)
              max_h = size - (2 * pad)
              scale = min(max_w / image.width, max_h / image.height)
              target = (
                  max(1, round(image.width * scale)),
                  max(1, round(image.height * scale)),
              )
              resized = image.resize(target, Image.Resampling.LANCZOS)
              x = (size - target[0]) // 2
              y = (size - target[1]) // 2
              canvas.alpha_composite(resized, (x, y))
              return canvas

          square(16).save("public/favicon-16x16.png", optimize=True)
          square(32).save("public/favicon-32x32.png", optimize=True)
          square(192).save("public/android-chrome-192x192.png", optimize=True)

          apple = square(180, padding=0.07, background=(255, 255, 255, 255)).convert("RGB")
          apple.save("public/apple-touch-icon.png", optimize=True, quality=95)

          icon = square(256)
          icon.save(
              "public/favicon.ico",
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          PY

      - name: Commit favicon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             public/favicon.ico             public/favicon-16x16.png             public/favicon-32x32.png             public/apple-touch-icon.png             public/android-chrome-192x192.png

          if git diff --cached --quiet; then
            echo "Favicon assets are already up to date."
            exit 0
          fi

          git commit -m "chore: add favicon assets"
          git push
