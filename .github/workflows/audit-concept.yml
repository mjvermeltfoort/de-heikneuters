name: Audit concept website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-concept.yml

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check pages and internal links
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          import html.parser
          import urllib.parse
          import time

          base = "http://concept.de-heikneuters.nl/"
          pages = [
              "",
              "agenda/",
              "contact/",
              "de-kneuterkapel/",
              "door-de-jaren-heen/",
              "ut-vurproefke/",
              "vrienden-van-de-heikneuters/",
          ]

          print("PAGE_CHECK_START")
          for path in pages:
              url = urllib.parse.urljoin(base, path)
              start = time.time()
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 site-audit"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                      print(f"{url} status={r.status} final={r.geturl()} bytes={len(body)} time={time.time()-start:.2f}s content_type={r.headers.get('content-type')}")
              except Exception as e:
                  print(f"{url} ERROR {e}")
          print("PAGE_CHECK_END")

          class LinkParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

          seen = set()
          queue = [base]
          broken = []
          print("LINK_CHECK_START")
          while queue and len(seen) < 50:
              url = queue.pop(0)
              if url in seen:
                  continue
              seen.add(url)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 site-audit"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      html = r.read().decode("utf-8","replace")
                      final = r.geturl()
                      print(f"CRAWL {url} -> {r.status} {final}")
              except Exception as e:
                  broken.append((url, str(e)))
                  continue

              p = LinkParser()
              p.feed(html)
              for href in p.links:
                  if href.startswith(("mailto:", "tel:", "javascript:", "#")):
                      continue
                  absolute = urllib.parse.urljoin(final, href)
                  parsed = urllib.parse.urlparse(absolute)
                  if parsed.netloc != "concept.de-heikneuters.nl":
                      continue
                  clean = urllib.parse.urlunparse((parsed.scheme, parsed.netloc, parsed.path, "", parsed.query, ""))
                  if clean not in seen and clean not in queue:
                      queue.append(clean)

          for url, err in broken:
              print("BROKEN", url, err)
          print("LINK_CHECK_END")
          PY

      - name: Show HTTP headers
        run: |
          echo "HEADERS_START"
          curl -sSIL http://concept.de-heikneuters.nl/ | sed -n '1,80p'
          echo "HEADERS_END"

      - name: Install Lighthouse
        run: npm install -g lighthouse@latest

      - name: Lighthouse mobile
        run: |
          lighthouse http://concept.de-heikneuters.nl/             --chrome-flags="--headless --no-sandbox"             --output=json             --output-path=/tmp/lh-mobile.json             --quiet

      - name: Lighthouse desktop
        run: |
          lighthouse http://concept.de-heikneuters.nl/             --preset=desktop             --chrome-flags="--headless --no-sandbox"             --output=json             --output-path=/tmp/lh-desktop.json             --quiet

      - name: Summarize Lighthouse
        run: |
          python3 - <<'PY'
          import json

          def report(path, label):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

              print(f"LIGHTHOUSE_{label}_START")
              cats = data["categories"]
              for key in ["performance","accessibility","best-practices","seo"]:
                  cat = cats.get(key)
                  if cat:
                      print(f"SCORE {key}={round(cat['score']*100)}")

              wanted = [
                  "first-contentful-paint",
                  "largest-contentful-paint",
                  "speed-index",
                  "total-blocking-time",
                  "cumulative-layout-shift",
                  "server-response-time",
                  "uses-responsive-images",
                  "modern-image-formats",
                  "uses-optimized-images",
                  "uses-text-compression",
                  "render-blocking-resources",
                  "unused-css-rules",
                  "unused-javascript",
                  "image-alt",
                  "color-contrast",
                  "heading-order",
                  "link-name",
                  "button-name",
                  "label",
                  "meta-description",
                  "document-title",
                  "crawlable-anchors",
                  "robots-txt",
                  "canonical",
                  "is-crawlable",
                  "errors-in-console",
                  "valid-source-maps",
                  "inspector-issues",
              ]
              audits = data["audits"]
              for key in wanted:
                  a = audits.get(key)
                  if not a:
                      continue
                  score = a.get("score")
                  display = a.get("displayValue","")
                  title = a.get("title","")
                  if key in ["first-contentful-paint","largest-contentful-paint","speed-index","total-blocking-time","cumulative-layout-shift","server-response-time"] or (score is not None and score < 1):
                      print(f"AUDIT {key} score={score} display={display} title={title}")

              failures = []
              for key,a in audits.items():
                  score = a.get("score")
                  mode = a.get("scoreDisplayMode")
                  if score is not None and score < 1 and mode not in ("notApplicable","manual","informative"):
                      failures.append((score,key,a.get("title",""),a.get("displayValue","")))
              for score,key,title,display in sorted(failures, key=lambda x:(x[0],x[1]))[:40]:
                  print(f"FAIL score={score} id={key} title={title} display={display}")
              print(f"LIGHTHOUSE_{label}_END")

          report("/tmp/lh-mobile.json","MOBILE")
          report("/tmp/lh-desktop.json","DESKTOP")
          PY
